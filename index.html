<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e88e5">
    <title>Cyclorer 2</title>
  </head>
  <body>
    <!-- VIEW - Spashscreen -->
    <div id="splash-view">
      <div class="splash-content">
        <div id="stats-wrapper">Explore <span class="stats-value" id="stats-area-count">192</span> areas with <span class="stats-value" id="stats-total-length">247km</span> of trails.</div>
      </div>
    </div>

    <!-- VIEW - Map -->
    <div id="map-view">
      <div id="tracking-map">
        <div id="score-container">
          <div class="label-small">Score</div>
          <div id="score">0m</div>
        </div>
      </div>
      <!--    <div id="gps" class="gps-icon"></div>-->
      <button id="settings-open" class="btn btn-lg settings-button ui-overlay-element">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             fill="currentColor"
             viewBox="0 0 16 16">
          <path fill-rule="evenodd"
                d="M2 4h12v1H2V4zm0 3h12v1H2V7zm0 3h12v1H2v-1z"/>
        </svg>
      </button>
      <button id="arealist-open" class = "btn btn-lg arealist-button ui-overlay-element">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-card-checklist" viewBox="0 0 16 16">
          <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"/>
          <path d="M7 5.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0M7 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0"/>
        </svg>
      </button>
      <button id="center-btn" class="btn btn-danger hidden">Center View</button>

      <div id="preview-map">
        <div id="directions"></div>
        <div id="description"></div>

        <div id="debug"></div>

        <div id="next-area" class="area-arrow">▶</div>
        <div id="previous-area" class="area-arrow">◀</div>
      </div>
    </div>


    <!-- VIEW - Settings -->
    <div id="settings" class="mb-7">
      <h3>Settings</h3>

      <div class="card mb-3">
        <div class="card-header">
          Map Display
        </div>

        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-deadends">
            <label class="form-check-label" for="settings-deadends">Show deadends</label><br>
          </div>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-frequency-heatmap">
            <label class="form-check-label" for="settings-frequency-heatmap">Show Heatmap - Frequency</label><br>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="settings-area-bbox">
            <label class="form-check-label" for="settings-area-bbox">Show Area Bounding Box</label><br>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">Tile Services</div>

        <div class="card-body">
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-osm-tiles" value="osm">
            <label class="form-check-label" for="settings-osm-tiles">OpenStreetMap</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-cyclosm-tiles" value="cyclosm">
            <label class="form-check-label" for="settings-cyclosm-tiles">Cyclosm</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="mapService" id="settings-opentopo-tiles" value="opentopo">
            <label class="form-check-label" for="settings-opentopo-tiles">OpenTopoMap</label>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">Misc</div>
        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-show-debug">
            <label class="form-check-label" for="settings-show-debug">Show Debug Info</label><br>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="settings-toggle-overlays">
            <label class="form-check-label" for="settings-toggle-overlays">Hide Overlays when riding</label><br>
          </div>
        </div>
      </div>

      <button id="settings-close" class="btn btn-danger btn-lg w-100">Close</button>
    </div>

    <!-- VIEW - List of areas -->
    <div id="area-view" class="hide-list"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
