<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyc-areas</title>
  </head>
  <body>
    <!-- VIEW - Map -->
    <div id="map-view">
      <div id="tracking-map"></div>
      <!--    <div id="gps" class="gps-icon"></div>-->
      <button id="settings-open" class="btn btn-dark btn-lg">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             fill="currentColor"
             viewBox="0 0 16 16">
          <path fill-rule="evenodd"
                d="M2 4h12v1H2V4zm0 3h12v1H2V7zm0 3h12v1H2v-1z"/>
        </svg>
      </button>

      <div id="preview-map">
        <div id="description"></div>
        <div id="debug"></div>
      </div>
    </div>


    <!-- VIEW - Settings -->
    <div id="settings" class="mb-7">
      <h3>Settings</h3>

      <div class="form-check form-switch mb-lg-3">
        <input class="form-check-input" type="checkbox" id="settings-deadends">
        <label class="form-check-label" for="settings-deadends">Show deadends</label><br>
      </div>

      <div class="form-check form-switch mb-lg-3">
        <input class="form-check-input" type="checkbox" id="settings-heatmap-count">
        <label class="form-check-label" for="settings-heatmap-count">Show Heatmap - Frequency</label><br>
      </div>

      <div class="form-check form-switch mb-lg-3">
        <input class="form-check-input" type="checkbox" id="settings-area-bbox">
        <label class="form-check-label" for="settings-area-bbox">Show Area Bounding Box</label><br>
      </div>

      <button id="settings-close" class="btn btn-danger btn-lg w-100">Close</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
