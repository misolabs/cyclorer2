<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e88e5">

    <!-- Roboto Font -->
<!--    <link rel="preconnect" href="https://fonts.googleapis.com">-->
<!--    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>-->
<!--    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">-->

    <!-- Material design icon font (need this link to generate a font file for downloading in network monitor) -->
<!--    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" />-->

    <title>Cyclorer 2</title>
  </head>
  <body>
    <div id="notifications-view" class="notifications-stack" aria-live="polite" aria-atomic="true"></div>

    <!-- VIEW - Splashscreen -->
    <div id="splash-view">
      <div class="splash-content">
        <div id="stats-wrapper">Explore <span class="stats-value" id="stats-area-count">192</span> areas with <span class="stats-value" id="stats-total-length">247km</span> of trails.</div>
        <div id="build-timestamp">23-08-1977 @ 15:47:00</div>
      </div>
    </div>

    <!-- VIEW - Powersave -->
    <div id="powersave-view" class="hidden">
      <div id="powersave-header">
        <img src="./public/assets/logo_white.svg" style="width:100px;height:100px;" />
        <div id="powersave-quote" class="roboto-font mt-3" style="font-size: larger;">If it's not raining<br>It's not training.</div>
      </div>
      <div id="powersave-junction-container" class="hide">
        <div id="powersave-junction-preview"></div>
        <div id="powersave-distance-junction">0m</div>
      </div>
      <div id="weather-alert-container" class="hide">
        <i class="wi wi-2x wi-owm-02n"></i>
        <span class="alert-text">Heavy rain in 5 min</span>
      </div>
    </div>

    <!-- VIEW - Map -->
    <div id="map-view">
      <div id="tracking-map" class="minipreview">
        <!-- Overlay - On-Screen Buttons -->
        <div id="buttons-overlay" class="">
          <button id="open-annotation-menu" class="btn btn-secondary cyc-menu-button cyc-only-desktop">
            <span class="material-symbols-rounded">pin_drop</span>
          </button>

          <div id="zoom-toggle-btn" class="cyc-menu-button-hitbox">
            <div class="btn btn-secondary cyc-menu-button cyc-always-visible">
              <span class="material-symbols-rounded">zoom_out</span>
            </div>
          </div>

          <div id="settings-open" class="cyc-menu-button-hitbox">
            <div class="btn btn-secondary cyc-menu-button">
              <span class="material-symbols-rounded">menu</span>
            </div>
          </div>

          <div id="center-btn" class="cyc-menu-button-hitbox hide">
            <div class="btn btn-danger cyc-menu-button">
              <span class="material-symbols-rounded">my_location</span>
            </div>
          </div>

          <div id="drop-pin-generic" class="cyc-menu-button-hitbox cyc-always-visible cyc-only-mobile">
            <div class="btn btn-danger cyc-menu-button ">
              <span class="material-symbols-rounded">add_location</span>
            </div>
          </div>

          <div id="powersave-enable-btn" class="cyc-menu-button-hitbox ">
            <div class="btn btn-danger cyc-menu-button">
              <span class="material-symbols-rounded">visibility_lock</span>
            </div>
          </div>

          <div id="annotation-menu-container" class="cyc-menu-container hide">
            <button id="drop-pin-danger" class="btn btn-danger cyc-menu-button mt-3 mb-3">
              <span class="material-symbols-rounded">skull</span>
            </button>
            <button id="drop-pin-favorite" class="btn btn-success cyc-menu-button mt-3">
              <span class="material-symbols-rounded">favorite</span>
            </button>
            <button id="drop-pin-explore" class="btn btn-warning cyc-menu-button mt-3">
              <span class="material-symbols-rounded">not_listed_location</span>
            </button>
            <button id="drop-pin-climb" class="btn btn-danger cyc-menu-button mt-3">
              <span class="material-symbols-rounded">elevation</span>
            </button>
            <button id="drop-pin-text" class="btn btn-secondary cyc-menu-button">
              <span class="material-symbols-rounded">text_fields</span>
            </button>
          </div>
        </div>

        <div id="score-container">
          <div class="label-small roboto-font">Score</div>
          <div class= "roboto-font" id="score">0m</div>
        </div>
      </div>
    </div>


    <!-- VIEW - Settings -->
    <div id="settings-view" class="mb-7">
      <div style="display:flex;flex-direction: row; align-items: center;">
        <h3>Settings</h3>
        <button style="margin-left: auto; color:white;" id="sync-data-btn" class = "btn">
          <span class="material-symbols-rounded">sync_desktop</span>
        </button>
      </div>

      <div class="mb-3">
        <input type="radio" class="btn-check" name="options-outlined" id="nm-none" autocomplete="off" checked>
        <label class="btn btn-outline-warning" for="nm-none">None</label>

        <input type="radio" class="btn-check" name="options-outlined" id="nm-exploration" autocomplete="off">
        <label class="btn btn-outline-success" for="nm-exploration">Exploration</label>

        <input type="radio" class="btn-check" name="options-outlined" id="nm-navigation" autocomplete="off">
        <label class="btn btn-outline-success" for="nm-navigation">Navigate</label>
      </div>

      <div class="card mb-3">
        <div class="card-header">
          Map Display
        </div>

        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-deadends">
            <label class="form-check-label" for="settings-deadends">Show deadends</label><br>
          </div>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-frequency-heatmap">
            <label class="form-check-label" for="settings-frequency-heatmap">Show Heatmap - Frequency</label><br>
          </div>

          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="settings-area-bbox">
            <label class="form-check-label" for="settings-area-bbox">Show Area Bounding Box</label><br>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">Tile Services</div>

        <div class="card-body">
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-osm-tiles" value="osm">
            <label class="form-check-label" for="settings-osm-tiles">OpenStreetMap</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-cyclosm-tiles" value="cyclosm">
            <label class="form-check-label" for="settings-cyclosm-tiles">Cyclosm</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-opentopo-tiles" value="opentopo">
            <label class="form-check-label" for="settings-opentopo-tiles">OpenTopoMap</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" name="mapService" id="settings-stadia-tiles" value="stadia_outdoors">
            <label class="form-check-label" for="settings-opentopo-tiles">Stadia Outdoors</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="mapService" id="settings-mtb-tiles" value="mtbmap">
            <label class="form-check-label" for="settings-opentopo-tiles">MTB Map</label>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">Misc</div>
        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-show-debug">
            <label class="form-check-label" for="settings-show-debug">Show Debug Info</label><br>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="settings-show-debug-notifications">
            <label class="form-check-label" for="settings-show-debug-notifications">Show Debug Notifications</label><br>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="settings-toggle-overlays">
            <label class="form-check-label" for="settings-toggle-overlays">Hide Overlays when riding</label><br>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">Caches</div>
        <div class="card-body">
          <div id="cache-stats" class="mb-3"></div>
          <button id="clear-cache-btn" class="btn btn-primary w-100">Clear Tile Cache</button>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">System info</div>
        <div class="card-body">
          <div class="mb-3">
            <strong>Annotation retry queue:</strong>
            <span id="annotation-request-queue-size">0</span>
          </div>
          <div class="mb-3">
            <strong>GPS updates:</strong>
            <span id="gps-update-count">0</span>
          </div>
        </div>
      </div>

      <button id="settings-close-btn" class="btn btn-danger btn-lg w-100">Close</button>
    </div>

    <!-- App entry point -->
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
